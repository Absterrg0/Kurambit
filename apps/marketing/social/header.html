<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Kurambit profile header</title>
    <link rel="stylesheet" href="kit.css" />
    <style>
      /* X lays the avatar over the bottom-left corner (about 400 by 170 at
         1500 wide) and phones trim a little off the top and bottom, so the
         copy keeps to the upper band and the left stays clear below it. */

      .copy {
        position: absolute;
        left: 112px;
        top: 92px;
      }

      h1 {
        font-size: 92px;
      }

      .stroke {
        width: 250px;
        margin-top: 22px;
        font-size: 92px;
      }

      .stage {
        position: absolute;
        right: 150px;
        bottom: 47px;
        width: 380px;
        height: 436px;
      }

      .enso {
        inset: 14px -54px 70px;
      }

      #fox {
        width: 100%;
        height: 100%;
      }

      .ground {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 40px;
        height: 9px;
        background: var(--ink);
        opacity: 0.7;
        -webkit-mask: url("../site/brush-rule.svg") 0 0 / 100% 100% no-repeat;
        mask: url("../site/brush-rule.svg") 0 0 / 100% 100% no-repeat;
      }

      /* The wordmark variant: the footer's pixel wordmark across the sheet. */
      [data-v="wordmark"] .copy,
      [data-v="wordmark"] .stage {
        display: none;
      }

      #wordmark {
        display: none;
        position: absolute;
        left: 90px;
        right: 90px;
        top: 84px;
        height: 250px;
      }

      [data-v="wordmark"] #wordmark {
        display: block;
        width: calc(100% - 180px);
      }

      .line {
        display: none;
        position: absolute;
        right: 104px;
        top: 362px;
        font-family: var(--display);
        font-style: italic;
        font-size: 38px;
        color: var(--ink-2);
      }

      [data-v="wordmark"] .line {
        display: block;
      }

      [data-v="wordmark"] .ground {
        left: 90px;
        right: 90px;
        bottom: auto;
        top: 340px;
      }
    </style>
  </head>
  <body>
    <div class="copy">
      <h1>Your coding agent,<br />now a game studio.</h1>
      <i class="stroke"></i>
    </div>
    <div class="stage">
      <i class="enso"></i>
      <canvas id="fox"></canvas>
    </div>
    <i class="ground"></i>
    <canvas id="wordmark"></canvas>
    <p class="line">Your coding agent, now a game studio.</p>
    <script src="kit.js"></script>
    <script>
      const { params } = sizePage(1500, 500);
      const wordmark = params.get("v") === "wordmark";
      whenDrawn(
        document.fonts.ready.then(() =>
          wordmark
            ? inkWordmark(document.getElementById("wordmark"), { cell: 7 })
            : inkImage(document.getElementById("fox"), "../site/fox-ink.webp", {
                // X shows the header at 600 wide or less: big cells keep it ink, not grey.
                cell: 6,
                align: "bottom",
              }),
        ),
      );
    </script>
  </body>
</html>
