<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Kurambit avatar</title>
    <link rel="stylesheet" href="kit.css" />
    <style>
      /* Profile pictures are cropped to a circle; the head sits low so its
         ears clear the rim and its ruff runs out past the bottom. */
      .head {
        position: absolute;
        left: 50%;
        bottom: -2%;
        width: 74%;
        height: 74%;
        transform: translateX(-50%);
        object-fit: contain;
      }

      .head:not([data-show]) {
        display: none;
      }

      /* The fox as a mask, for printing it in any colour. */
      i.head {
        background: var(--fox);
        -webkit-mask: url("../../../assets/brand/kurambit-head.png") center / contain no-repeat;
        mask: url("../../../assets/brand/kurambit-head.png") center / contain no-repeat;
      }

      /* Seal: a vermilion stamp with the paper's fibres pressed into it. */
      [data-v^="seal"] body {
        background: var(--shu);
      }

      [data-v^="seal"] body::before {
        content: "";
        position: absolute;
        inset: 0;
        background: url("../site/washi.svg") 0 0 / 420px 420px;
        mix-blend-mode: multiply;
      }

      [data-v="seal"] {
        --fox: var(--sheet);
      }

      [data-v="seal-ink"] {
        --fox: var(--ink);
      }

      [data-v="ink"] body {
        background: #141412;
      }

      [data-v="ink"] {
        --fox: #efe7d6;
      }
    </style>
  </head>
  <body>
    <img class="head" src="../../../assets/brand/kurambit-head.png" alt="" />
    <canvas class="head"></canvas>
    <i class="head"></i>
    <script src="kit.js"></script>
    <script>
      const { width, params } = sizePage(800, 800);
      const variant = params.get("v") ?? "paper";
      const shown = variant === "paper" ? "img" : variant === "pixel" ? "canvas" : "i";
      document.querySelector(`${shown}.head`).dataset.show = "";
      whenDrawn(
        variant === "pixel"
          ? inkImage(
              document.querySelector("canvas.head"),
              "../../../assets/brand/kurambit-head.png",
              {
                cell: Math.round(width / 80),
                inkWeight: 1,
                curve: [0.3, 0.7],
                align: "bottom",
              },
            )
          : document.querySelector("img.head").decode(),
        // The mask image loads with the stylesheet; give it a frame to paint.
        new Promise((done) => setTimeout(done, 300)),
      );
    </script>
  </body>
</html>
