<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Kurambit link card</title>
    <link rel="stylesheet" href="kit.css" />
    <style>
      /* The link card: the fox's face, drawn in ink and cropped large, beside
         the headline, signed with a vermilion seal the way a print is.
         sun=1 sets a vermilion sun behind the fox. */
      .sun {
        position: absolute;
        display: none;
        right: calc(var(--w) * -0.02);
        top: calc(var(--h) * 0.1);
        width: calc(var(--h) * 0.86);
        height: calc(var(--h) * 0.86);
        border-radius: 50%;
        background:
          url("../../site/washi.svg") 0 0 / 420px 420px,
          var(--shu);
        background-blend-mode: multiply;
      }

      [data-sun] .sun {
        display: block;
      }

      .face {
        position: absolute;
        right: calc(var(--w) * -0.19);
        top: calc(var(--h) * -0.14);
        width: calc(var(--h) * 1.3);
        height: calc(var(--h) * 1.3);
        background: var(--ink);
        -webkit-mask: url("../../../../assets/brand/kurambit-head.png") center / contain no-repeat;
        mask: url("../../../../assets/brand/kurambit-head.png") center / contain no-repeat;
      }

      .name {
        position: absolute;
        left: calc(var(--w) * 0.05);
        top: calc(var(--h) * 0.085);
        font-family: var(--display);
        font-size: calc(var(--h) * 0.046);
        letter-spacing: -0.01em;
      }

      h1 {
        position: absolute;
        left: calc(var(--w) * 0.05);
        bottom: calc(var(--h) * 0.11);
        font-size: calc(var(--h) * 0.108);
        line-height: 1.02;
      }

      h1 em {
        color: var(--shu-deep);
      }

      .seal {
        position: relative;
        display: inline-block;
        width: 0.62em;
        height: 0.62em;
        margin-left: 0.28em;
        vertical-align: 0.02em;
        background: var(--shu);
        -webkit-mask: url("../../site/seal-mask.svg") center / 100% 100% no-repeat;
        mask: url("../../site/seal-mask.svg") center / 100% 100% no-repeat;
      }

      .seal::after {
        content: "";
        position: absolute;
        inset: 14%;
        background: var(--sheet);
        -webkit-mask: url("../../../../assets/brand/kurambit-head.png") center / contain no-repeat;
        mask: url("../../../../assets/brand/kurambit-head.png") center / contain no-repeat;
      }
    </style>
  </head>
  <body>
    <i class="sun"></i>
    <i class="face"></i>
    <p class="name">Kurambit</p>
    <h1>Nobody made the<br />game you want.<br /><em>So make it.</em><i class="seal"></i></h1>
    <script src="kit.js"></script>
    <script>
      sizePage(1200, 630);
      whenDrawn(
        document.fonts.load('400 100px "Redaction"'),
        new Promise((done) => setTimeout(done, 300)),
      );
    </script>
  </body>
</html>
