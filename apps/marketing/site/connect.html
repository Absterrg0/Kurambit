<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ede6d7" />
    <meta name="color-scheme" content="light" />
    <meta name="robots" content="noindex" />
    <title>Connect · Kurambit</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="favicon.ico?v=2" sizes="any" />
    <script src="connect.js" defer></script>
  </head>
  <body>
    <div class="page">
      <main class="prose">
        <h1>Connect Kurambit</h1>
        <p data-connect-status>Sign in with GitHub so your Kurambit app can publish games.</p>
        <div data-connect-signin></div>
        <div data-connect-confirm hidden>
          <p>Check that this code matches the one in Kurambit:</p>
          <p class="connect-code" data-connect-code></p>
          <button type="button" data-connect-approve>Connect this Kurambit</button>
        </div>
      </main>
    </div>
  </body>
</html>
