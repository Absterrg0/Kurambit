<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{GAME_NAME}}</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #game {
        display: block;
        touch-action: none;
      }
    </style>
    <!-- Kurambit's three.js runtime, major 1 (_kurambit/runtime/three/1/): three.js, its addons
         and the bridge that runs main.js for the Stage, its checks and its replays. Kurambit
         serves it and copies it into every export; the game never edits it. "./vendor/" and
         "./shell/" map the game's own imports there, so every module shares one three.js.
         "#main" is how the bridge loads this game's main.js. -->
    <script type="importmap">
      {
        "imports": {
          "three": "./_kurambit/runtime/three/1/vendor/three.module.js",
          "three/addons/": "./_kurambit/runtime/three/1/vendor/addons/",
          "three/examples/jsm/": "./_kurambit/runtime/three/1/vendor/addons/",
          "postprocessing": "./_kurambit/runtime/three/1/vendor/postprocessing/index.js",
          "n8ao": "./_kurambit/runtime/three/1/vendor/n8ao/N8AO.js",
          "./vendor/": "./_kurambit/runtime/three/1/vendor/",
          "./shell/": "./_kurambit/runtime/three/1/shell/",
          "#main": "./main.js"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="game"></canvas>
    <!-- The bridge loads on its own first, so a main.js that does not parse or imports a
         missing module still reports the error. -->
    <script type="module" src="./_kurambit/runtime/three/1/shell/studio.js"></script>
    <script type="module" src="./_kurambit/runtime/three/1/shell/shell.js"></script>
  </body>
</html>
