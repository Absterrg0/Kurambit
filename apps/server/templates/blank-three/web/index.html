<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{GAME_NAME}}</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./style.css" />
    <!-- Vendored addons import the bare "three"; this maps it to the same file
         main.js imports, so every module shares one three.js instance. -->
    <script type="importmap">
      { "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }
    </script>
  </head>
  <body>
    <canvas id="game" aria-label="{{GAME_NAME}}"></canvas>
    <div id="hud" aria-live="polite"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
