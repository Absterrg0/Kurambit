<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Either scheme, so the Art tab's frame stays see-through over the app's own surface. -->
    <meta name="color-scheme" content="light dark" />
    <title>Model viewer</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        outline: none;
      }
    </style>
    <!-- The Workbench's Art tab opens this page from the game's own server, so it reads the
         game's files as the game does, with the runtime's one three.js. -->
    <script type="importmap">
      {
        "imports": {
          "three": "../vendor/three.module.js",
          "three/addons/": "../vendor/addons/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module" src="./viewer.js"></script>
  </body>
</html>
