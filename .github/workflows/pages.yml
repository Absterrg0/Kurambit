name: Marketing site

on:
  push:
    branches:
      - main
    paths:
      - apps/marketing/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps

      - name: Build
        env:
          MARKETING_BASE: /${{ github.event.repository.name }}/
        run: vp run --filter @kurambit/marketing build

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/marketing/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
